name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_vocabulary_db.dart
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_vocabulary_db.dart
      - run: flutter build windows --release
      # Downloads as Flashcards-windows.zip; unzip and run flashcard.exe.
      - uses: actions/upload-artifact@v4
        with:
          name: Flashcards-windows
          path: build/windows/x64/runner/Release/

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_vocabulary_db.dart
      - run: flutter build ios --release --no-codesign
      # An unsigned .ipa; it has to be signed with an Apple ID before it can be
      # installed on an iPhone (see README).
      - name: Package Flashcards.ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa && zip -qr ../Flashcards.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Flashcards-ios
          path: Flashcards.ipa
