name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_vocabulary_db.dart
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_vocabulary_db.dart
      - run: flutter build windows --release
      # Downloads as Wordeck-windows.zip; unzip and run Wordeck.exe.
      - uses: actions/upload-artifact@v4
        with:
          name: Wordeck-windows
          path: build/windows/x64/runner/Release/

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_vocabulary_db.dart
      - run: flutter build apk --release
      # Signed with a debug key: fine for installing directly on a phone, but
      # Google Play needs a release key (see README).
      - run: cp build/app/outputs/flutter-apk/app-release.apk Wordeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wordeck-android
          path: Wordeck.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_vocabulary_db.dart
      - run: flutter build ios --release --no-codesign
      # An unsigned .ipa; it has to be signed with an Apple ID before it can be
      # installed on an iPhone (see README).
      - name: Package Wordeck.ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa && zip -qr ../Wordeck.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Wordeck-ios
          path: Wordeck.ipa
