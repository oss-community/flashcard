name: flashcard
description: "Multilingual vocabulary flashcards"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  fsrs: ^2.0.1
  intl: ^0.20.3
  window_manager: ^0.5.2
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/vocabulary.db
    - assets/fonts/OFL.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
